name: Release RC

on:
  push:
    tags:
      - 'v*.*.*-rc.*'

permissions:
  contents: write   # create the GitHub pre-release
  packages: write
  id-token: write   # keyless cosign signing (Sigstore OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kubeswift-io/kubeswift
  CHART_OCI_PUSH: oci://ghcr.io/kubeswift-io/charts
  CHART_OCI_INSTALL: oci://ghcr.io/kubeswift-io/charts/kubeswift

jobs:
  build-and-push:
    name: Build and push images + chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller-manager
        id: build-controller-manager
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/controller-manager/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/controller-manager:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gpu-discovery
        id: build-gpu-discovery
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/gpu-discovery/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/gpu-discovery:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and push kubeswift-dra-driver
        id: build-dra-driver
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/kubeswift-dra-driver/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/kubeswift-dra-driver:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push snapshot-s3
        id: build-snapshot-s3
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/snapshot-s3/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/snapshot-s3:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push snapshot-oras
        id: build-snapshot-oras
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/snapshot-oras/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/snapshot-oras:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sandbox-materialize
        id: build-sandbox-materialize
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/sandbox-materialize/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sandbox-materialize:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push swiftletd
        id: build-swiftletd
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/swiftletd/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/swiftletd:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration-stunnel
        id: build-migration-stunnel
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/migration-stunnel/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/migration-stunnel:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signing: the signing identity is THIS workflow run's GitHub
      # OIDC identity (repo + workflow path + tag ref); the signature and
      # certificate are stored alongside the image in GHCR and logged in the
      # Rekor transparency log. Verify with:
      #   cosign verify <image>@<digest> \
      #     --certificate-identity-regexp 'https://github.com/kubeswift-io/kubeswift/\.github/workflows/release-(stable|rc)\.yaml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # Every image this workflow builds, digest-pinned, shared by the sign and
      # verify steps below so the two cannot drift.
      #
      # This replaces a hand-written sign list that had silently omitted
      # sandbox-materialize: it was built and pushed on every RC and never
      # signed, and nothing said so. That is the same defect #497 fixed in
      # release-stable, where it had shipped an unsigned image for five
      # releases. Deriving both steps from one list is what stops it recurring.
      #
      # NOTE this list is 8, not stable's 9 — release-rc does not build
      # kubeswift-gateway at all. That difference predates this change and is
      # left alone here; whether RC should build the gateway is #512.
      - name: Collect image refs
        id: refs
        run: |
          {
            echo 'list<<EOF'
            echo "${{ env.IMAGE_PREFIX }}/controller-manager@${{ steps.build-controller-manager.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/gpu-discovery@${{ steps.build-gpu-discovery.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/snapshot-s3@${{ steps.build-snapshot-s3.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/snapshot-oras@${{ steps.build-snapshot-oras.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/kubeswift-dra-driver@${{ steps.build-dra-driver.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/sandbox-materialize@${{ steps.build-sandbox-materialize.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/swiftletd@${{ steps.build-swiftletd.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/migration-stunnel@${{ steps.build-migration-stunnel.outputs.digest }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Sign images (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          echo "${{ steps.refs.outputs.list }}" | while read -r ref; do
            [ -n "$ref" ] || continue
            echo "signing $ref"
            cosign sign "$ref"
          done

      # An RC is what someone installs to test an upgrade before it ships. If
      # `cosign verify` fails on one of its images, the tester cannot tell
      # "we forgot to sign it" from "someone tampered with it" — which is the
      # entire property the signature is meant to provide. So the RC checks its
      # own work, exactly as release-stable does.
      #
      # Identity is pinned to THIS workflow file, not release-(stable|rc): an
      # RC image must be signed by the RC workflow.
      - name: Verify signatures (fail the RC if signing did not take)
        run: |
          set -euo pipefail
          echo "${{ steps.refs.outputs.list }}" | while read -r ref; do
            [ -n "$ref" ] || continue
            echo "verifying $ref"
            cosign verify "$ref" \
              --certificate-identity-regexp '^https://github\.com/kubeswift-io/kubeswift/\.github/workflows/release-rc\.yaml@.*$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
          done
          echo "all $(echo "${{ steps.refs.outputs.list }}" | grep -c .) images verified"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Configure Helm for OCI
        run: helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        id: chart
        run: |
          helm package charts/kubeswift --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }}
          helm push kubeswift-${{ steps.version.outputs.version }}.tgz ${{ env.CHART_OCI_PUSH }} 2>&1 | tee chart-push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]*' chart-push.log | head -1)
          test -n "$DIGEST"   # fail loud if helm stops printing the digest
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "ghcr.io/kubeswift-io/charts/kubeswift@${{ steps.chart.outputs.digest }}"

      # Create the GitHub pre-release so RC tags are visible on the Releases
      # page (previously only release-stable.yaml created releases; RC releases
      # had to be created by hand — v0.3.0-rc.1 gap).
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KubeSwift ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          # MAINTAINERS: the image list in the body below is hand-maintained and
          # must stay in step with the `refs` step above — it listed six of the
          # eight built images until this change. Keep notes like this one HERE,
          # in the workflow: everything under `body:` is published to the release
          # page, where guidance aimed at us is just noise for readers.
          body: |
            Release candidate — see the matching CHANGELOG.md section for
            details and Known Limitations.

            ## Install

            ```bash
            helm install kubeswift ${{ env.CHART_OCI_INSTALL }} --version ${{ steps.version.outputs.version }} -n kubeswift-system --create-namespace
            ```

            ## Images

            All eight are signed, and verified by this workflow before the
            pre-release is published.

            - `ghcr.io/kubeswift-io/kubeswift/controller-manager:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/swiftletd:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/gpu-discovery:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/snapshot-s3:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/snapshot-oras:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/migration-stunnel:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/kubeswift-dra-driver:${{ steps.version.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/sandbox-materialize:${{ steps.version.outputs.tag }}`

            ## Supply chain

            Images and the chart are cosign-signed (keyless, GitHub OIDC) and carry
            SLSA build provenance + SPDX SBOM attestations (BuildKit, in-registry).

            ```bash
            cosign verify ghcr.io/kubeswift-io/kubeswift/controller-manager:${{ steps.version.outputs.tag }} \
              --certificate-identity-regexp 'https://github.com/kubeswift-io/kubeswift/.github/workflows/release-(stable|rc).yaml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
