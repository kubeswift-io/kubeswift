name: Image scan

# Phase 2 of #466 — container vulnerability scanning for the nine published
# images.
#
# GATING POLICY (the open question in #466; this implements the recommendation
# there, and is the one knob to revisit if it proves wrong):
#
#   fail   HIGH/CRITICAL that HAS a fix available
#   report everything else, including unfixable HIGH/CRITICAL
#
# The asymmetry is deliberate. A fixable HIGH is an action item: bump the base
# image. An unfixable one is someone else's upstream backlog, and gating on it
# blocks every release until a third party ships — which in practice gets the
# whole scanner disabled. `--ignore-unfixed` on the gating pass keeps red
# meaning "you can do something about this".
#
# Nothing is hidden: the report pass runs regardless and uploads SARIF, so
# unfixable findings are visible in the Security tab and can be tracked without
# holding the build hostage.

permissions:
  contents: read
  security-events: write # SARIF upload

on:
  pull_request:
    # Only when an image's build inputs change — a docs PR should not pay for
    # nine container builds.
    paths:
      - 'images/**'
      - 'go.mod'
      - 'go.sum'
      - 'rust/**'
      - '.github/workflows/image-scan.yaml'
  push:
    branches: [main]
    # Same filter as the PR trigger, and for the same reason. Without it every
    # merge to main — including a docs typo — rebuilds and rescans all nine
    # images. A batch of 13 dependency merges queued 117 build jobs and starved
    # the runners, which is how this was noticed.
    #
    # Nothing is lost: a merge that does not touch these paths cannot change the
    # images, and the nightly run below re-scans the full matrix anyway, so
    # main's current state is still established every day.
    paths:
      - 'images/**'
      - 'go.mod'
      - 'go.sum'
      - 'rust/**'
      - '.github/workflows/image-scan.yaml'
  schedule:
    # The important one. CVEs are disclosed against images we already shipped,
    # without anything in this repo changing.
    - cron: '43 5 * * *'

jobs:
  # The watcher for the cosign pin. Two things make this necessary rather than
  # nice-to-have:
  #
  #   * Dependabot cannot see it. COSIGN_VERSION is a Containerfile ARG consumed
  #     by a curl, not a FROM, so the docker ecosystem never looks at it. In the
  #     repo's whole history Dependabot has opened exactly one cosign PR, and it
  #     was for the sigstore/cosign-installer ACTION, not this binary.
  #   * The Trivy report pass used to be the accidental watcher -- a stale pin
  #     showed up as CVEs attributed to the vendored binary. That is now skipped
  #     (it was 16 permanently-unactionable alerts describing sigstore's build),
  #     so this job carries the signal explicitly instead.
  #
  # Failure policy mirrors the scan job's: fail on what is actionable now, warn
  # on what needs a decision.
  #
  #   pins disagree  -> ERROR always. Two images signing with different cosign
  #                     builds is our bug and fixable in one edit.
  #   pin is behind  -> ERROR on the nightly schedule, WARNING on a PR. Bumping
  #                     cosign means re-running hack/cosign-interop.sh first, so
  #                     it is a deliberate change, and an unrelated PR should not
  #                     go red because sigstore shipped a release this morning.
  #                     The nightly exists for exactly this class of "the world
  #                     changed while the repo did not".
  cosign-freshness:
    name: cosign freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pinned cosign against the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pins=$(sed -n 's/^ARG COSIGN_VERSION=\(.*\)$/\1/p' images/*/Containerfile | sort -u)
          if [ -z "$pins" ]; then
            echo "::error::no ARG COSIGN_VERSION found in images/*/Containerfile"
            exit 1
          fi
          if [ "$(printf '%s\n' "$pins" | wc -l)" -ne 1 ]; then
            echo "::error::cosign pins disagree across images: $(printf '%s ' $pins)"
            exit 1
          fi
          echo "pinned:  $pins"

          # A flaky/rate-limited API must not fail the build -- this job reports
          # staleness, it does not verify anything about the current commit.
          if ! latest=$(gh api repos/sigstore/cosign/releases/latest --jq .tag_name 2>/dev/null) || [ -z "$latest" ]; then
            echo "::warning::could not reach the sigstore/cosign releases API; skipping the freshness comparison"
            exit 0
          fi
          echo "latest:  $latest"

          if [ "$pins" = "$latest" ]; then
            echo "cosign $pins is current"
            echo "cosign \`$pins\` is current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          msg="pinned cosign $pins is behind the latest release $latest. Re-run hack/cosign-interop.sh, then bump ARG COSIGN_VERSION in images/*/Containerfile."
          {
            echo "### cosign is behind"
            echo
            echo "| pinned | latest |"
            echo "|---|---|"
            echo "| \`$pins\` | \`$latest\` |"
            echo
            echo "Bumping requires re-running \`hack/cosign-interop.sh\` first (see the note in images/sandbox-materialize/Containerfile)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"

  scan:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad image should not mask the other eight
      matrix:
        image:
          - controller-manager
          - swiftletd
          - kubeswift-gateway
          - gpu-discovery
          - sandbox-materialize
          - snapshot-s3
          - snapshot-oras
          - migration-stunnel
          - kubeswift-dra-driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/${{ matrix.image }}/Containerfile
          push: false
          load: true
          tags: scan-target:${{ matrix.image }}

      # Trivy is driven as a CLI rather than through trivy-action. The action
      # writes its report via inputs whose contract differs across versions —
      # the first run here produced no SARIF at all and the upload step failed
      # on a missing path, with nothing scanned. Invoking the binary keeps the
      # output contract ours, and removes a third-party action from a workflow
      # that holds security-events: write.
      - name: Install trivy
        env:
          TRIVY_VERSION: '0.73.0'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy --version

      # Report pass: everything, never fails. Populates the Security tab,
      # including the unfixable findings the gate deliberately ignores.
      # --skip-files matches the gate below, and for the same reason: cosign is a
      # VENDORED third-party binary, and Trivy reads the module versions baked
      # into it and attributes them to us. Every one of those findings describes
      # sigstore's build, not ours -- the clearest example being x/crypto, where
      # the binary reports v0.53.0 while our own go.mod is already on the fixed
      # v0.55.0. They are unactionable here: the pin is always the latest cosign
      # release, so there is nothing to bump.
      #
      # This does narrow "nothing is hidden" above, so the signal those findings
      # were carrying -- "the pinned cosign is behind" -- moves to the
      # cosign-freshness job below, which checks that directly instead of
      # inferring it from CVE noise. Dependabot cannot see COSIGN_VERSION (it is
      # a Containerfile ARG, not a FROM), so without that job the pin would have
      # no watcher at all.
      - name: Trivy (report)
        run: |
          /tmp/trivy image \
            --format sarif \
            --output "trivy-${{ matrix.image }}.sarif" \
            --severity MEDIUM,HIGH,CRITICAL \
            --skip-files usr/local/bin/cosign \
            --exit-code 0 \
            "scan-target:${{ matrix.image }}"
          test -s "trivy-${{ matrix.image }}.sarif"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # Gating pass: only what we can actually act on.
      #
      # --skip-files exempts VENDORED THIRD-PARTY BINARIES from the gate (not
      # from the report above). snapshot-oras and sandbox-materialize ship a
      # prebuilt cosign release binary. Trivy reads the Go build info compiled
      # into it and reports its dependencies as ours, but we do not build cosign
      # and cannot bump what it links — only sigstore can, by cutting a release.
      # Trivy's "fixed version" column means "a fix exists in the library", not
      # "you can apply it", so --ignore-unfixed does not filter these.
      #
      # Concretely: cosign v2.6.5 (the newest 2.x, and 2.x is required — see the
      # Containerfile note on --tlog-upload) still carries 24 fixable HIGH/
      # CRITICAL findings. The only remedy available to us is to bump cosign,
      # which is already done. Gating on the remainder would mean a permanently
      # red build with no action attached, and the usual outcome of that is
      # someone disables the scanner.
      #
      # This is scoped to one exact path, not a blanket suppression: everything
      # we compile is still gated, and the report pass keeps the cosign findings
      # visible in the Security tab. The real fix is to link cosign as a Go
      # library so it becomes a managed go.mod dependency — tracked in #486.
      - name: Trivy (gate on fixable HIGH/CRITICAL)
        run: |
          /tmp/trivy image \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-files usr/local/bin/cosign \
            --exit-code 1 \
            "scan-target:${{ matrix.image }}"
