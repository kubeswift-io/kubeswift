name: Security

# Phase 1 of the CI security programme (#466): dependency vulnerabilities and
# secrets. These three are here first because they are QUIET — a finding is
# almost always real and actionable — which is what makes it defensible to fail
# the build on them. Noisier tooling (image scanning, SAST, policy) lands in
# later phases so it can be tuned without eroding trust in a red build.
#
# Everything here is read-only.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Vulnerability databases change without our code changing, so a nightly
    # run is the point: it catches an advisory published against a dependency
    # we already ship.
    - cron: '17 4 * * *'

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # go.mod pins the minor; stdlib vulnerabilities are fixed in PATCH
          # releases. Without this, setup-go installs exactly go1.25 and
          # govulncheck reports 29 stdlib findings fixed in go1.25.3 — real
          # advisories, but ones no dependency change can address. Track the
          # newest patch of the pinned minor instead.
          check-latest: true
      - name: govulncheck
        run: |
          # Scoped to our own packages rather than ./... : build/kernels/sandbox
          # is a buildroot output tree that (when present) contains GCC's Go
          # testsuite, which does not compile and is not ours. It is gitignored,
          # so a fresh CI checkout would not have it — the explicit list keeps
          # this identical to what a developer runs locally.
          go run golang.org/x/vuln/cmd/govulncheck@latest ./api/... ./internal/... ./cmd/...

  cargo-audit:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cargo audit
        working-directory: rust
        run: |
          cargo install cargo-audit --locked
          # Advisories fail; `unmaintained` warnings do not. An unmaintained
          # crate is a real signal but not an exploitable one, and gating on it
          # would make the build red for something no upgrade can fix today.
          cargo audit

  gitleaks:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history: a credential committed and later "removed" is still
          # in the objects, and still valid until it is rotated.
          fetch-depth: 0
      - name: gitleaks
        env:
          # Pinned; bumped by Dependabot is not possible for a raw download, so
          # this is reviewed by hand when the scanner is updated.
          GITLEAKS_VERSION: '8.30.0'
        run: |
          set -euo pipefail
          # The gitleaks ACTION is commercially licensed for organization-owned
          # repos ("[kubeswift-io] is an organization. License key is
          # required."). The binary is MIT. Running it directly keeps the scan,
          # drops the licence requirement, and removes a third-party action
          # from a workflow that would otherwise hold a token.
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose
