name: Release Stable

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign signing (Sigstore OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kubeswift-io/kubeswift
  CHART_OCI_PUSH: oci://ghcr.io/kubeswift-io/charts
  CHART_OCI_INSTALL: oci://ghcr.io/kubeswift-io/charts/kubeswift

jobs:
  build-and-push:
    if: "!contains(github.ref_name, '-rc')"
    name: Build and push images + chart
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller-manager
        id: build-controller-manager
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/controller-manager/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/controller-manager:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gpu-discovery
        id: build-gpu-discovery
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/gpu-discovery/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/gpu-discovery:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and push kubeswift-dra-driver
        id: build-dra-driver
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/kubeswift-dra-driver/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/kubeswift-dra-driver:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push snapshot-s3
        id: build-snapshot-s3
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/snapshot-s3/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/snapshot-s3:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push snapshot-oras
        id: build-snapshot-oras
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/snapshot-oras/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/snapshot-oras:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sandbox-materialize
        id: build-sandbox-materialize
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/sandbox-materialize/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sandbox-materialize:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push swiftletd
        id: build-swiftletd
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/swiftletd/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/swiftletd:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration-stunnel
        id: build-migration-stunnel
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/migration-stunnel/Containerfile
          push: true
          # SLSA build provenance + SPDX SBOM, attached to the image in the
          # registry by BuildKit (no GitHub attestation store dependency -- that
          # requires Enterprise on private repos).
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/migration-stunnel:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kubeswift-gateway
        id: build-gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./images/kubeswift-gateway/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/kubeswift-gateway:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # PIN the cosign BINARY, not just the installer action. Unpinned, the
          # action installs the newest cosign, and cosign 3.x moved where a
          # signature lands: 2.x writes a `sha256-<digest>.sig` tag, 3.x writes
          # `sha256-<digest>` with no suffix. Anything that looks for a signature
          # by tag name silently stops finding one across that boundary.
          # 2.6.5 also matches the cosign vendored into snapshot-oras and
          # sandbox-materialize, so the project speaks one cosign version.
          cosign-release: 'v2.6.5'

      # Keyless signing: the signing identity is THIS workflow run's GitHub
      # OIDC identity (repo + workflow path + tag ref); the signature and
      # certificate are stored alongside the image in GHCR and logged in the
      # Rekor transparency log. Verify with:
      #   cosign verify <image>@<digest> \
      #     --certificate-identity-regexp 'https://github.com/kubeswift-io/kubeswift/\.github/workflows/release-(stable|rc)\.yaml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # The nine refs, digest-pinned, shared by the sign and verify steps below
      # so the two can never drift. sandbox-materialize used to be missing from
      # the sign list — eight of nine were signed and nothing said so.
      - name: Collect image refs
        id: refs
        run: |
          {
            echo 'list<<EOF'
            echo "${{ env.IMAGE_PREFIX }}/controller-manager@${{ steps.build-controller-manager.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/gpu-discovery@${{ steps.build-gpu-discovery.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/snapshot-s3@${{ steps.build-snapshot-s3.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/snapshot-oras@${{ steps.build-snapshot-oras.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/kubeswift-dra-driver@${{ steps.build-dra-driver.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/sandbox-materialize@${{ steps.build-sandbox-materialize.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/swiftletd@${{ steps.build-swiftletd.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/migration-stunnel@${{ steps.build-migration-stunnel.outputs.digest }}"
            echo "${{ env.IMAGE_PREFIX }}/kubeswift-gateway@${{ steps.build-gateway.outputs.digest }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Sign images (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          echo "${{ steps.refs.outputs.list }}" | while read -r ref; do
            [ -n "$ref" ] || continue
            echo "signing $ref"
            cosign sign "$ref"
          done

      # VERIFY WHAT WE JUST SIGNED — the point of Phase 5 (#466).
      #
      # Producing signatures and never checking them means an image that misses
      # signing is indistinguishable from one that got it. That is not
      # hypothetical: sandbox-materialize was absent from the sign list above and
      # shipped UNSIGNED in EVERY release up to and including v0.13.6 — probed at
      # v0.12.0, v0.13.0, v0.13.2, v0.13.4 and v0.13.6, no signature at any of
      # them, while every other image at those same tags verifies. For all of
      # those releases the job reported success and nothing flagged it. v0.13.7
      # is the first release in which all nine are signed.
      #
      # Because the list is now derived from the same `refs` output the signing
      # loop uses, an image cannot be built-and-published without also being
      # signed and verified — the three steps cannot drift apart.
      #
      # The identity is this workflow's own OIDC identity, so it is pinned to
      # the exact workflow file and repo rather than "anything Sigstore signed".
      - name: Verify signatures (fail the release if signing did not take)
        run: |
          set -euo pipefail
          echo "${{ steps.refs.outputs.list }}" | while read -r ref; do
            [ -n "$ref" ] || continue
            echo "verifying $ref"
            cosign verify "$ref" \
              --certificate-identity-regexp '^https://github\.com/kubeswift-io/kubeswift/\.github/workflows/release-stable\.yaml@.*$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
          done
          echo "all $(echo "${{ steps.refs.outputs.list }}" | grep -c .) images verified"

      # The SBOM and SLSA provenance are attached by BuildKit (provenance:
      # mode=max, sbom: true on every build above) as an attestation manifest
      # inside the image INDEX — not as a cosign attestation, so `cosign
      # verify-attestation` does not see them. This is a presence check on the
      # index, which is what BuildKit's output actually supports.
      - name: Verify SBOM + provenance are attached
        run: |
          set -euo pipefail
          echo "${{ steps.refs.outputs.list }}" | while read -r ref; do
            [ -n "$ref" ] || continue
            n=$(docker buildx imagetools inspect --raw "$ref" \
                 | grep -c 'attestation-manifest' || true)
            if [ "$n" -eq 0 ]; then
              echo "::error::$ref has no attestation manifest (provenance/SBOM missing)"
              exit 1
            fi
            echo "$ref: $n attestation manifest(s)"
          done

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.0

      - name: Configure Helm for OCI
        run: helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Generate and sync CRDs
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make generate
          cp config/crd/bases/*.yaml charts/kubeswift/crds/

      - name: Package and push chart
        id: chart
        run: |
          helm package charts/kubeswift --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }}
          helm push kubeswift-${{ steps.version.outputs.version }}.tgz ${{ env.CHART_OCI_PUSH }} 2>&1 | tee chart-push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]*' chart-push.log | head -1)
          test -n "$DIGEST"   # fail loud if helm stops printing the digest
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "ghcr.io/kubeswift-io/charts/kubeswift@${{ steps.chart.outputs.digest }}"

  github-release:
    if: "!contains(github.ref_name, '-rc')"
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build swiftctl
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          GIT_COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X github.com/kubeswift-io/kubeswift/internal/version.Version=${VERSION} -X github.com/kubeswift-io/kubeswift/internal/version.GitCommit=${GIT_COMMIT} -X github.com/kubeswift-io/kubeswift/internal/version.BuildDate=${BUILD_DATE}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/swiftctl-linux-amd64 ./cmd/swiftctl
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/swiftctl-darwin-amd64 ./cmd/swiftctl
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/swiftctl-darwin-arm64 ./cmd/swiftctl

      - name: Checksums
        run: cd dist && sha256sum swiftctl-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # PIN the cosign BINARY, not just the installer action. Unpinned, the
          # action installs the newest cosign, and cosign 3.x moved where a
          # signature lands: 2.x writes a `sha256-<digest>.sig` tag, 3.x writes
          # `sha256-<digest>` with no suffix. Anything that looks for a signature
          # by tag name silently stops finding one across that boundary.
          # 2.6.5 also matches the cosign vendored into snapshot-oras and
          # sandbox-materialize, so the project speaks one cosign version.
          cosign-release: 'v2.6.5'

      # Keyless blob signing of the checksums file. Verifying SHA256SUMS via
      # the .sig/.pem pair transitively authenticates every binary it lists.
      - name: Sign checksums (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: KubeSwift ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          # MAINTAINERS: the image list in the body below is hand-maintained and
          # must stay in step with the `refs` step above. It listed four of nine
          # until v0.13.7 — the same kind of hand-maintained list that let
          # sandbox-materialize ship unsigned for five releases. Keep the note
          # here, in the workflow: everything under `body:` is published to the
          # release page, where guidance aimed at us is just noise for readers.
          body: |
            ## Install

            ```bash
            helm install kubeswift ${{ env.CHART_OCI_INSTALL }} --version ${{ needs.build-and-push.outputs.version }} -n kubeswift-system --create-namespace
            ```

            ## Upgrade

            `helm upgrade` does **not** upgrade CRDs — Helm treats `crds/` as
            install-only and offers no flag to change it. Apply them yourself
            after every upgrade, or the API server silently drops any field a
            stale schema does not know:

            ```bash
            helm upgrade kubeswift ${{ env.CHART_OCI_INSTALL }} --version ${{ needs.build-and-push.outputs.version }} \
              -n kubeswift-system -f <(helm get values kubeswift -n kubeswift-system -o yaml)
            kubectl apply -k https://github.com/kubeswift-io/kubeswift/config/crd?ref=${{ github.ref_name }}
            ```

            Check the CHANGELOG entry for this release before upgrading: it says
            whether any CRD actually changed.

            ## Images

            All nine are signed, and verified by the release workflow before publishing.

            - `ghcr.io/kubeswift-io/kubeswift/controller-manager:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/swiftletd:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/gpu-discovery:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/migration-stunnel:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/kubeswift-gateway:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/kubeswift-dra-driver:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/sandbox-materialize:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/snapshot-s3:${{ needs.build-and-push.outputs.tag }}`
            - `ghcr.io/kubeswift-io/kubeswift/snapshot-oras:${{ needs.build-and-push.outputs.tag }}`

            ## swiftctl

            Download the `swiftctl` binary for your platform from the Assets below.

            ## Supply chain

            Images and the Helm chart are **cosign-signed** (keyless, GitHub OIDC)
            and carry **SLSA build provenance + SPDX SBOM** attestations attached
            in-registry by BuildKit. Verify an image:

            ```bash
            cosign verify ghcr.io/kubeswift-io/kubeswift/controller-manager:${{ github.ref_name }} \
              --certificate-identity-regexp 'https://github.com/kubeswift-io/kubeswift/.github/workflows/release-(stable|rc).yaml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            docker buildx imagetools inspect ghcr.io/kubeswift-io/kubeswift/controller-manager:${{ github.ref_name }} --format '{{ json .Provenance }}'
            ```

            Verify the binaries (SHA256SUMS is cosign-signed; the checksums then cover each binary):

            ```bash
            cosign verify-blob --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
              --certificate-identity-regexp 'https://github.com/kubeswift-io/kubeswift/.github/workflows/release-stable.yaml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
            sha256sum -c SHA256SUMS
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
