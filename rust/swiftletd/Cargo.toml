[package]
name = "swiftletd"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
env_logger = "0.11"
# Stream helpers for the pod watch (already in the tree through kube).
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
libc = "0.2"
log = "0.4"
# Intent integrity check (already in the tree through rustls).
sha2 = "0.11"
# Egress credentials: the per-launcher intercept CA and its leaf certificates
# (ECDSA P-256, name-constrained). ring is already in the tree through rustls.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Certificate validity for rcgen (already in the tree through it).
time = "0.3"
# SPIFFE: the built-in broker fetches the sandbox's X.509-SVID from the
# Workload API (gRPC over a unix socket: h2 plus a hand-written decoder for
# the few protobuf fields used) and originates TLS with it. Everything but h2
# is already in the tree through kube's rustls client.
h2 = "0.4"
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "signal", "net", "io-util", "time"] }
# kube + k8s-openapi are version-locked and must move together (a Dependabot
# group enforces it). Features are only what swiftletd actually uses: a client
# that patches pod annotations, plus one DynamicObject status patch. "runtime"
# (watchers/reflectors/controllers) and "derive" (CustomResource) were enabled
# but never used by a single line — swiftletd is not a controller.
kube = { version = "5.0", features = ["client"] }
# v1_34 matches the fleet (k0s / kubeadm 1.34). Only core/v1 Pod is used, whose
# shape has been stable for many releases, so this is not load-bearing — but a
# feature that trails the cluster by six minors invites a surprise that is not
# worth carrying.
k8s-openapi = { version = "0.29", features = ["v1_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swift-seed = { path = "../swift-seed" }
swift-runtime = { path = "../swift-runtime" }
swift-ch-client = { path = "../swift-ch-client" }
swift-qemu-client = { path = "../swift-qemu-client" }
swift-vsock-client = { path = "../swift-vsock-client" }

[dev-dependencies]
futures-channel = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }

[[bin]]
name = "swiftletd"
path = "src/main.rs"
