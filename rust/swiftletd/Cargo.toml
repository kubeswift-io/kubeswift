[package]
name = "swiftletd"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
# kube + k8s-openapi are version-locked and must move together (a Dependabot
# group enforces it). Features are only what swiftletd actually uses: a client
# that patches pod annotations, plus one DynamicObject status patch. "runtime"
# (watchers/reflectors/controllers) and "derive" (CustomResource) were enabled
# but never used by a single line — swiftletd is not a controller.
kube = { version = "4.2", features = ["client"] }
# v1_34 matches the fleet (k0s / kubeadm 1.34). Only core/v1 Pod is used, whose
# shape has been stable for many releases, so this is not load-bearing — but a
# feature that trails the cluster by six minors invites a surprise that is not
# worth carrying.
k8s-openapi = { version = "0.28", features = ["v1_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swift-seed = { path = "../swift-seed" }
swift-runtime = { path = "../swift-runtime" }
swift-ch-client = { path = "../swift-ch-client" }
swift-qemu-client = { path = "../swift-qemu-client" }
swift-vsock-client = { path = "../swift-vsock-client" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[[bin]]
name = "swiftletd"
path = "src/main.rs"
