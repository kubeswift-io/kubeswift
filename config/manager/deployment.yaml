apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: kubeswift-system
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeswift
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: controller-manager
      # Same hardened context as the Helm chart: the controller-manager is a
      # plain Go binary on distroless/static-debian12:nonroot and needs no host
      # access. (The launcher pods are privileged, deliberately and separately.)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller-manager
          image: ghcr.io/kubeswift-io/kubeswift/controller-manager:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --leader-elect
            - --webhook-enabled=false
            # Live-migration mTLS (Phase 3c) is off in the minimal install.
            # The config/overlays/migration-mtls overlay flips this to true
            # and provisions the cert-manager PKI chain (mirrors the Helm
            # migration.mtls.enabled gate). See `make deploy-with-mtls`.
            - --migration-mtls-enabled=false
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          # Readiness waits for the webhook server when webhooks are on.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
