---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: swiftartifactplacements.sandbox.kubeswift.io
spec:
  group: sandbox.kubeswift.io
  names:
    kind: SwiftArtifactPlacement
    listKind: SwiftArtifactPlacementList
    plural: swiftartifactplacements
    shortNames:
    - sap
    singular: swiftartifactplacement
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .status.preparedNodes
      name: Prepared
      type: integer
    - jsonPath: .status.targetNodes
      name: Nodes
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Prepared")].reason
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SwiftArtifactPlacement prepares OCI artifacts on the nodes of a
          SwiftSandboxPool before a checkout asks for them. See
          docs/sandbox/warm-pool.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SwiftArtifactPlacementSpec names OCI artifacts to prepare in the node cache
              of every node that hosts a slot of a SwiftSandboxPool, so a checkout that
              mounts one does not fetch it first. It changes nothing in the pool or its
              slots: the slots keep running, and a checkout still names its artifacts in
              its own spec.artifacts, with its own credentials and key.
            properties:
              artifacts:
                description: Artifacts to prepare, each pinned by digest.
                items:
                  description: |-
                    PlacementArtifact is one artifact to prepare. A checkout uses the prepared
                    entry when its own spec.artifacts names the same repository and digest,
                    layout and verification key.
                  properties:
                    claims:
                      additionalProperties:
                        type: string
                      description: |-
                        Claims and RequirePlatformVerification are as in a SwiftSandbox
                        artifact: a checkout uses the prepared entry only when its own
                        artifact asks for the same claims.
                      maxProperties: 8
                      type: object
                    layout:
                      default: oci
                      description: |-
                        Layout is oci (default) or unpacked, as in a SwiftSandbox artifact:
                        the two are separate entries in the node cache.
                      enum:
                      - oci
                      - unpacked
                      type: string
                    name:
                      description: |-
                        Name identifies the artifact within the placement: a DNS label of at
                        most 40 characters.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    pullSecretRef:
                      description: |-
                        PullSecretRef names a docker-registry Secret in this namespace for the
                        artifact's registry. The registry must authorize these credentials,
                        as it must a checkout's own.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    ref:
                      description: Ref is the artifact's reference, pinned by digest
                        (repo@sha256:...).
                      maxLength: 512
                      pattern: ^[^@\s]+@sha256:[a-f0-9]{64}$
                      type: string
                    requirePlatformVerification:
                      type: boolean
                    verifyKeySecretRef:
                      description: |-
                        VerifyKeySecretRef names a Secret holding a cosign public key
                        (cosign.pub). The artifact is verified with it before it is cached; a
                        checkout that verifies with the same key then needs no fetch.
                      properties:
                        name:
                          description: Name of the Secret.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - name
                  - ref
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              poolRef:
                description: |-
                  PoolRef names the SwiftSandboxPool, in this namespace, whose slots'
                  nodes receive the artifacts. A node is a target while it runs at least
                  one of the pool's slots.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - artifacts
            - poolRef
            type: object
          status:
            description: SwiftArtifactPlacementStatus reports where the artifacts
              are prepared.
            properties:
              artifacts:
                description: Artifacts is the state of each artifact.
                items:
                  description: PlacementArtifactStatus is one artifact.
                  properties:
                    digest:
                      description: Digest is the artifact's digest, once the registry
                        has authorized it.
                      type: string
                    message:
                      description: Message says why the registry or a policy refused
                        it.
                      type: string
                    name:
                      description: Name is the artifact's name in spec.artifacts.
                      type: string
                    policies:
                      description: Policies are the SwiftArtifactVerificationPolicies
                        that govern it.
                      items:
                        description: |-
                          ArtifactPolicyReference names a SwiftArtifactVerificationPolicy at a
                          generation.
                        properties:
                          generation:
                            format: int64
                            type: integer
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    preparedNodes:
                      description: PreparedNodes is how many target nodes hold it.
                      format: int32
                      type: integer
                    reason:
                      description: Reason is Authorized, Resolving, ArtifactRefused
                        or PolicyDenied.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions: Prepared is True when every target node holds every
                  artifact, False while any is not (reason Preparing, PrepareFailed,
                  ArtifactRefused, PoolNotFound or NoTargetNodes).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodes:
                description: Nodes is the state of each target node.
                items:
                  description: PlacementNodeStatus is one target node.
                  properties:
                    failures:
                      description: |-
                        Failures counts failed attempts since the node was last prepared; the
                        backoff doubles with each, from 30s to 10m.
                      format: int32
                      type: integer
                    lastFailureTime:
                      description: |-
                        LastFailureTime is when preparing last failed; the next attempt waits
                        out a backoff from it.
                      format: date-time
                      type: string
                    message:
                      description: Message says what failed, when something did.
                      type: string
                    name:
                      description: Name is the node.
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the spec generation Prepared
                        refers to.
                      format: int64
                      type: integer
                    prepared:
                      description: |-
                        Prepared is true when the node's cache held every artifact of the
                        observed generation, verified and recorded as read from its
                        repository, the last time it was checked (PreparedAt).
                      type: boolean
                    preparedAt:
                      description: PreparedAt is when the node was last found prepared.
                      format: date-time
                      type: string
                    reason:
                      description: |-
                        Reason is Prepared, Preparing, VerificationFailed, ClaimMismatch or
                        PrepareFailed; NotATarget for a prepared node that no longer runs a slot
                        of the pool, kept (and not counted) until its recheck would be due, so
                        that a slot returning to it finds it prepared.
                      type: string
                    requirements:
                      description: |-
                        Requirements identifies the platform verification the node was
                        prepared under (a hash of every artifact's governing policies, keys and
                        claims). When a policy change alters it, the node is prepared again.
                      type: string
                  required:
                  - name
                  - prepared
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  describes.
                format: int64
                type: integer
              preparedNodes:
                description: PreparedNodes is how many of them hold every artifact.
                format: int32
                type: integer
              targetNodes:
                description: TargetNodes is how many nodes host a slot of the pool.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
