# Tier B local-backend SwiftSnapshot of snapshot-local-source.
#
# Captures the source VM's memory state to an on-node hostPath under
# /var/lib/kubeswift/snapshots/. The webhook enforces that prefix.
# `includeMemory: true` is the default — explicit here for clarity.
#
# After Ready, 04-restore-inplace.yaml restores this snapshot back into
# the same VM (in-place fast path), and 05/06 restore it into clones.
#
# resumeAfterSnapshot: false leaves the captured VM paused. A memory
# snapshot does not capture the disk, so an in-place restore is only
# disk-consistent if nothing ran on that disk after the capture. A
# resumed source keeps writing to it, and the in-place restore refuses
# (reason DiskDiverged) rather than resume old memory over a newer disk.
apiVersion: snapshot.kubeswift.io/v1alpha1
kind: SwiftSnapshot
metadata:
  name: snapshot-local-mem
spec:
  guestRef:
    name: snapshot-local-source
  backend:
    type: local
    local:
      hostPath: /var/lib/kubeswift/snapshots/default-snapshot-local-mem
  includeMemory: true
  resumeAfterSnapshot: false
