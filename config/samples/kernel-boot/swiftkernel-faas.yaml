apiVersion: kernel.kubeswift.io/v1alpha1
kind: SwiftKernel
metadata:
  name: faas-minimal
  namespace: default
spec:
  ociRef:
    # Published by the project; pull it as-is. To run your own build instead,
    # see docs/swiftkernel.md -- build/kernels/faas-minimal/ is the Buildroot
    # project, and you push the result to a registry your nodes can reach.
    image: ghcr.io/kubeswift-io/kubeswift/kernels/faas:6.6.3
  kernelCmdline: "console=ttyS0 root=/dev/ram0 rdinit=/init"
  profile: faas-minimal
