# Scenario 5: Tier B local-backend memory snapshot. Pauses the VM
# and serialises RAM to a directory on its node derived from the
# snapshot's namespace and name:
# /var/lib/kubeswift/snapshots/snapshots-wt-s5_s5-mem-snap.
#
# resumeAfterSnapshot: false keeps the VM paused after the capture, so
# its disk stays exactly as the captured memory expects. The snapshot
# holds memory only; the in-place restore refuses a guest that ran on
# its disk afterwards.
apiVersion: snapshot.kubeswift.io/v1alpha1
kind: SwiftSnapshot
metadata:
  name: s5-mem-snap
spec:
  guestRef:
    name: s5-source
  backend:
    type: local
  includeMemory: true
  resumeAfterSnapshot: false
