# Prometheus Operator ServiceMonitor for the KubeSwift controller-manager
# /metrics endpoint. Apply ONLY if your cluster runs the Prometheus Operator
# (the monitoring.coreos.com CRDs must exist). It is intentionally NOT part
# of `make deploy` (kustomize installs stay monitoring-CRD-free). Helm users
# should prefer `--set monitoring.enabled=true`, which renders the chart's
# equivalent (templates/monitoring/servicemonitor.yaml) plus the dashboard
# ConfigMaps — this sample exists for non-Helm installs.
#
#   kubectl apply -f config/grafana/servicemonitor.yaml
#
# Adjust namespace + the release label selector to match your install.
#
# The controller serves /metrics over HTTPS to authorized callers only
# (--metrics-secure, the default since v0.15.0), so bind Prometheus's
# ServiceAccount to the kubeswift-metrics-reader ClusterRole:
#
#   kubectl create clusterrolebinding kubeswift-metrics-reader \
#     --clusterrole=kubeswift-metrics-reader \
#     --serviceaccount=<prometheus-namespace>:<prometheus-serviceaccount>
#
# For a controller run with --metrics-secure=false, drop scheme, tlsConfig and
# bearerTokenFile below.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubeswift-controller-manager
  namespace: kubeswift-system
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: controller-manager
    # Some Prometheus Operator installs select ServiceMonitors by a `release`
    # label — set it to your kube-prometheus-stack release if so:
    # release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kubeswift-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: controller-manager
  endpoints:
    - port: metrics # the named port on kubeswift-controller-manager-metrics (8080)
      interval: 30s
      path: /metrics
      # A self-signed certificate, and Prometheus's own ServiceAccount token.
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
