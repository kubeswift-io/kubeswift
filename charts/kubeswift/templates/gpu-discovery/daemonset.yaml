{{- if .Values.gpuDiscovery.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-discovery
  namespace: {{ .Values.namespace }}
  annotations:
    # Policy baseline (#493). Only the host mount is excused here — this
    # DaemonSet IS non-root (uid 65534) and keeps the run-as-non-root check.
    ignore-check.kube-linter.io/sensitive-host-mounts: >-
      /sys is read for GPU, PCI, NUMA, IOMMU and hugepage topology. Inherent to
      a node-inspecting DaemonSet: it reads world-readable sysfs only, writes
      nothing, needs no /dev, runs as uid 65534 and drops ALL capabilities.
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: gpu-discovery
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: gpu-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeswift
        app.kubernetes.io/component: gpu-discovery
    spec:
      serviceAccountName: kubeswift-gpu-discovery
      hostPID: false
      hostNetwork: false
      # Asserting a property the image already has, rather than changing
      # behaviour: images/gpu-discovery/Containerfile ends in `USER 65534:65534`,
      # and the pod on the dev GPU node (worker-1) reports uid=65534(nobody) while
      # discovering the GTX 1080 correctly. runAsNonRoot makes the kubelet refuse
      # to start it if that ever regresses to root.
      #
      # NOTE the contrast with the DRA driver, which looks identical to a linter
      # (both were "missing runAsNonRoot") but must NOT get this: it runs as root
      # by design for kubelet plugin sockets and /var/run/cdi — see the comment in
      # dra-driver/daemonset.yaml. Adding runAsNonRoot there breaks plugin
      # registration. Discovery only reads world-readable sysfs, writes nothing,
      # and needs no /dev.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubeswift.io/gpu-node: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gpu-discovery
          image: {{ .Values.gpuDiscovery.image.registry }}/gpu-discovery:{{ include "kubeswift.imageTag" (dict "tag" .Values.gpuDiscovery.image.tag "appVersion" .Chart.AppVersion) }}
          args:
            - --interval={{ .Values.gpuDiscovery.interval | default "60s" }}
            - --v=2
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
          resources:
            {{- toYaml .Values.gpuDiscovery.resources | nindent 12 }}
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
{{- end }}
