{{- if .Values.sandboxMaterialize.podMode.enabled }}
{{- if not .Values.webhook.enabled }}
{{- fail "sandboxMaterialize.podMode.enabled needs webhook.enabled: the pod-mode webhook rewrites Pods into stand-ins" }}
{{- end }}
{{- if not (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- fail "sandboxMaterialize.podMode.enabled needs ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1, Kubernetes 1.30+): pod mode fails closed through it" }}
{{- end }}
{{- $ns := .Values.sandboxMaterialize.podMode.namespace }}
{{- $shim := include "kubeswift.sandboxMaterializeImage" . }}
# Pod mode (sandboxMaterialize.podMode). Every pod-mode SwiftSandbox and its
# privileged launcher live in this namespace; tenants get only the stand-in.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: pod-mode
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# The RuntimeClass a Pod names to run in a microVM. No node has this handler:
# a Pod that reaches a kubelet without being rewritten never starts a
# container ("no runtime for kubeswift-unrewritten is configured").
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kubeswift-microvm
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: pod-mode
handler: kubeswift-unrewritten
---
# Rewrites a Pod naming the RuntimeClass, in an opted-in namespace, into the
# stand-in. failurePolicy Fail: when the webhook cannot run, such a Pod is
# refused, never admitted unrewritten. The match condition keeps every other
# Pod away from the webhook.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kubeswift-pod-mode
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespace }}/kubeswift-webhook-cert
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: pod-mode
webhooks:
  - name: podmode.sandbox.kubeswift.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: Never
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: {{ .Values.namespace }}
        name: kubeswift-webhook-service
        path: /mutate-pods-podmode
    namespaceSelector:
      matchLabels:
        kubeswift.io/pod-mode: enabled
    matchConditions:
      - name: names-the-microvm-runtimeclass
        expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kubeswift-microvm'"
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
---
# Fail closed without the webhook, and keep a stand-in to the shim:
#  - a Pod still naming the RuntimeClass after mutation was not rewritten;
#  - a stand-in is created with exactly the shim container and volume;
#  - an update cannot change a stand-in's containers, workload annotation,
#    stand-in label or UID label (compared with the old object, so finalizer,
#    label and annotation updates still pass, including on a stand-in that was
#    changed while this policy was missing: the controller deletes those);
#  - no ephemeral container is added to a stand-in.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubeswift-pod-mode
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: pod-mode
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    # request.subResource is absent, not '', when there is none.
    - name: subResource
      expression: "has(request.subResource) ? request.subResource : ''"
    - name: standIn
      expression: "has(object.metadata.labels) && 'podmode.kubeswift.io/stand-in' in object.metadata.labels && object.metadata.labels['podmode.kubeswift.io/stand-in'] == 'true'"
    - name: oldStandIn
      expression: "oldObject != null && has(oldObject.metadata.labels) && 'podmode.kubeswift.io/stand-in' in oldObject.metadata.labels && oldObject.metadata.labels['podmode.kubeswift.io/stand-in'] == 'true'"
    - name: workload
      expression: "has(object.metadata.annotations) && 'podmode.kubeswift.io/workload' in object.metadata.annotations ? object.metadata.annotations['podmode.kubeswift.io/workload'] : ''"
    - name: oldWorkload
      expression: "oldObject != null && has(oldObject.metadata.annotations) && 'podmode.kubeswift.io/workload' in oldObject.metadata.annotations ? oldObject.metadata.annotations['podmode.kubeswift.io/workload'] : ''"
    - name: uid
      expression: "has(object.metadata.labels) && 'podmode.kubeswift.io/uid' in object.metadata.labels ? object.metadata.labels['podmode.kubeswift.io/uid'] : ''"
    - name: oldUID
      expression: "oldObject != null && has(oldObject.metadata.labels) && 'podmode.kubeswift.io/uid' in oldObject.metadata.labels ? oldObject.metadata.labels['podmode.kubeswift.io/uid'] : ''"
  validations:
    - expression: "variables.subResource != '' || !has(object.spec.runtimeClassName) || object.spec.runtimeClassName != 'kubeswift-microvm'"
      message: "pod mode: this Pod was not rewritten into a stand-in (is the namespace labelled kubeswift.io/pod-mode=enabled, and the KubeSwift webhook running?)"
      reason: Forbidden
    - expression: >-
        request.operation != 'CREATE' || variables.subResource != '' || !variables.standIn ||
        (size(object.spec.containers) == 1 &&
         object.spec.containers[0].image == '{{ $shim }}' &&
         !has(object.spec.containers[0].command) &&
         has(object.spec.containers[0].args) && size(object.spec.containers[0].args) > 0 &&
         object.spec.containers[0].args[0] == 'pod-shim' &&
         (!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) &&
         (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0) &&
         (!has(object.spec.volumes) || object.spec.volumes.all(v, v.name == 'kubeswift-podmode' && has(v.downwardAPI))))
      message: "pod mode: a stand-in has exactly the shim container"
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || variables.subResource != '' || !variables.oldStandIn ||
        (variables.standIn &&
         object.spec.containers == oldObject.spec.containers &&
         variables.workload == variables.oldWorkload &&
         (variables.oldUID == '' || variables.uid == variables.oldUID))
      message: "pod mode: a stand-in's containers, workload annotation, stand-in label and UID label cannot change"
      reason: Forbidden
    - expression: "request.operation != 'UPDATE' || variables.subResource != '' || variables.oldStandIn || !variables.standIn"
      message: "pod mode: the stand-in label cannot be added to an existing Pod"
      reason: Forbidden
    - expression: >-
        variables.subResource != 'ephemeralcontainers' || !variables.standIn ||
        !has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0
      message: "pod mode: ephemeral containers cannot be added to a stand-in (its workload runs in the microVM, not in this Pod)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubeswift-pod-mode
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: pod-mode
spec:
  policyName: kubeswift-pod-mode
  validationActions: [Deny]
---
# The webhook fails closed, so keep one controller-manager serving it through
# voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: controller-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: controller-manager
{{- end }}
