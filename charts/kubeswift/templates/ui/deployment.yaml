{{- if eq (include "kubeswift.uiEnabled" .) "true" }}
# kubeswift-ui: the KubeSwift web console (an Angular SPA served by nginx),
# released from the separate kubeswift-io/kubeswift-ui repo. It talks to the
# gateway above; in the default ui.gateway.mode=proxy the UI's nginx
# reverse-proxies the in-cluster kubeswift-gateway Service so the browser uses a
# single origin. See docs/ui/gateway.md and the kubeswift-ui README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeswift-ui
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeswift
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The UI serves static assets; the BROWSER talks to the gateway, not this
      # pod. It needs no Kubernetes API identity at all. Without these two lines
      # it falls back to the namespace `default` ServiceAccount and mounts its
      # token — verified on the dev cluster, where /var/run/secrets/kubernetes.io/
      # serviceaccount/{token,ca.crt,namespace} were all present in the running
      # pod. A dedicated empty SA plus automount:false removes a credential the
      # workload has no use for.
      serviceAccountName: kubeswift-ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          # Independently released from the kubeswift-ui repo, so (unlike the
          # operator images) the tag is NOT derived from the chart appVersion.
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            # How the BROWSER reaches the gateway (see values.yaml ui.gateway):
            {{- if eq .Values.ui.gateway.mode "proxy" }}
            # proxy: nginx reverse-proxies the gateway Service; the SPA points
            # at its own origin.
            - name: KUBESWIFT_GATEWAY_URL
              value: "@origin"
            - name: KUBESWIFT_GATEWAY_UPSTREAM
              value: "{{ .Values.ui.gateway.service }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.ui.gateway.port }}"
            {{- else }}
            # url: the SPA calls the gateway directly at this absolute URL.
            # Empty falls back to the app's built-in default (dev port-forward).
            - name: KUBESWIFT_GATEWAY_URL
              value: {{ .Values.ui.gateway.url | quote }}
            {{- end }}
            {{- if and .Values.ui.oidc.issuer .Values.ui.oidc.clientId }}
            # Browser OIDC login (must match gateway.oidc — same issuer+audience).
            - name: KUBESWIFT_OIDC_ISSUER
              value: {{ .Values.ui.oidc.issuer | quote }}
            - name: KUBESWIFT_OIDC_CLIENT_ID
              value: {{ .Values.ui.oidc.clientId | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # Read-only root as of kubeswift-ui v0.12.3. Before that the
            # entrypoint wrote the runtime config to
            # /usr/share/nginx/html/config.js — inside the directory the SPA is
            # baked into, which cannot be made writable by mounting over it
            # without hiding the application. kubeswift-io/kubeswift-ui#43 moved
            # it to /tmp/kubeswift-ui/config.js, served by an nginx alias.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The two paths this image still has to write, and the ONLY two.
            #
            # /tmp                  nginx's pid plus all five *_temp_path dirs,
            #                       and now the generated config.js.
            # /etc/nginx/conf.d     20-envsubst-on-templates.sh renders
            #                       default.conf here from the template at
            #                       startup. The directory holds nothing else in
            #                       the image, so an emptyDir masks nothing.
            #
            # Both must be writable by uid 101. An emptyDir is created 0777, so
            # it is; a docker --tmpfs defaults to root-owned 0775 and is NOT,
            # which is worth knowing if you reproduce this outside Kubernetes.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf-d
          emptyDir: {}
{{- end }}
