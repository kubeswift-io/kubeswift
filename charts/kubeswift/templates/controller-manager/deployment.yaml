{{- $metricsSecure := and .Values.controllerManager.metrics .Values.controllerManager.metrics.secure }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: controller-manager
spec:
  replicas: {{ .Values.controllerManager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeswift
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: controller-manager
      # The controller-manager is a plain Go binary on
      # distroless/static-debian12:nonroot — it needs no host access at all, so
      # it gets the same hardened context as the gateway, UI and gpu-discovery.
      # (The LAUNCHER pods are privileged, deliberately, and separately — see
      # docs/security-audit.md SEC-01/02/03. That is not a reason for the
      # controller to be.)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller-manager
          image: {{ .Values.controllerManager.image.registry }}/controller-manager:{{ include "kubeswift.imageTag" (dict "tag" .Values.controllerManager.image.tag "appVersion" .Chart.AppVersion) }}
          env:
            - name: KUBESWIFT_LAUNCHER_IMAGE
              value: {{ .Values.swiftletd.image.registry }}/swiftletd:{{ include "kubeswift.imageTag" (dict "tag" .Values.swiftletd.image.tag "appVersion" .Chart.AppVersion) }}
            {{- with .Values.swiftletd.imagePullSecrets }}
            # Launcher pods run as a dedicated ServiceAccount from v0.13.6, so
            # they no longer inherit imagePullSecrets attached to the namespace
            # `default` SA. Set these when the launcher image is on a private
            # registry — otherwise the switch shows up as ImagePullBackOff.
            - name: KUBESWIFT_LAUNCHER_IMAGE_PULL_SECRETS
              value: {{ join "," . | quote }}
            {{- end }}
            # Sizes a node's shared-base thin pool when it first creates one.
            # Nodes take a pool only when labelled kubeswift.io/basedisk-node=true.
            - name: KUBESWIFT_BASEDISK_POOL_SIZE
              value: {{ .Values.swiftGuest.sharedBaseDisk.poolSize | quote }}
            - name: KUBESWIFT_SNAPSHOT_S3_IMAGE
              value: {{ .Values.snapshotS3.image.registry }}/snapshot-s3:{{ include "kubeswift.imageTag" (dict "tag" .Values.snapshotS3.image.tag "appVersion" .Chart.AppVersion) }}
            - name: KUBESWIFT_SNAPSHOT_ORAS_IMAGE
              value: {{ .Values.snapshotORAS.image.registry }}/snapshot-oras:{{ include "kubeswift.imageTag" (dict "tag" .Values.snapshotORAS.image.tag "appVersion" .Chart.AppVersion) }}
            - name: KUBESWIFT_MIGRATION_STUNNEL_IMAGE
              value: {{ .Values.migrationStunnel.image.registry }}/migration-stunnel:{{ include "kubeswift.imageTag" (dict "tag" .Values.migrationStunnel.image.tag "appVersion" .Chart.AppVersion) }}
            - name: KUBESWIFT_SANDBOX_MATERIALIZE_IMAGE
              value: {{ .Values.sandboxMaterialize.image.registry }}/sandbox-materialize:{{ include "kubeswift.imageTag" (dict "tag" .Values.sandboxMaterialize.image.tag "appVersion" .Chart.AppVersion) }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --leader-elect
            {{- if .Values.webhook.enabled }}
            - --webhook-enabled=true
            {{- else }}
            - --webhook-enabled=false
            {{- end }}
            {{- if .Values.scopedLauncherRBAC.enabled }}
            - --scoped-launcher-rbac=true
            {{- end }}
            {{- if .Values.migration.mtls.enabled }}
            - --migration-mtls-enabled=true
            {{- end }}
            {{- /* Always explicit: the binary's default is secure, and an
                   upgrade with --reuse-values that kept secure: false (or
                   predates the key) must keep serving plain HTTP. */}}
            - --metrics-secure={{ ternary "true" "false" (not (not $metricsSecure)) }}
            {{- range .Values.swiftGuest.allowedHostPathPrefixes }}
            - --allowed-hostpath-prefix={{ . }}
            {{- end }}
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          # Readiness waits for the webhook server when webhooks are on
          # (failurePolicy: Fail): a Ready pod that does not serve them yet
          # fails every guarded write.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controllerManager.resources | nindent 12 }}
          {{- if or .Values.webhook.enabled $metricsSecure }}
          volumeMounts:
            {{- if .Values.webhook.enabled }}
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- if $metricsSecure }}
            # Secure metrics serve a self-signed certificate written here; the
            # root filesystem is read-only.
            - name: metrics-cert
              mountPath: /tmp/k8s-metrics-server
            {{- end }}
          {{- end }}
      {{- if or .Values.webhook.enabled $metricsSecure }}
      volumes:
        {{- if .Values.webhook.enabled }}
        - name: webhook-cert
          secret:
            secretName: kubeswift-webhook-cert
        {{- end }}
        {{- if $metricsSecure }}
        - name: metrics-cert
          emptyDir: {}
        {{- end }}
      {{- end }}
