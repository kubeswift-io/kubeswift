{{- if eq (include "kubeswift.gatewayEnabled" .) "true" }}
# kubeswift-gateway: the browser-facing Connect hub for the KubeSwift UI. Runs
# in this (hub) cluster, watches fleet.kubeswift.io Cluster objects, and fans
# the read plane out across the registered member clusters. See
# docs/ui/gateway.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeswift-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubeswift
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeswift
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeswift
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: kubeswift-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.gateway.image.registry }}/kubeswift-gateway:{{ include "kubeswift.imageTag" (dict "tag" .Values.gateway.image.tag "appVersion" .Chart.AppVersion) }}
          args:
            - --listen=:{{ .Values.gateway.port }}
            - --clusters-namespace={{ .Values.namespace }}
            {{- /*
              auth-mode=insecure performs NO authentication: insecureAuthenticator
              returns an empty identity with no error, so every caller runs as the
              member cluster credential -- the whole Connect surface plus the
              console/exec WebSocket planes, unauthenticated. That is a documented
              dev/lab mode, but combined with an Ingress it puts an unauthenticated
              control plane on the network, and CheckOrigin is permissive on the
              WebSocket upgrades so any web page can drive it.

              Refuse the combination rather than rely on the operator reading a
              comment. gateway.allowInsecureIngress is the explicit override for
              anyone who genuinely wants it (an isolated lab behind other controls).

              REACHABILITY IS THE TRIGGER, NOT gateway.ingress (issue #459). The
              first version of this guard checked only gateway.ingress.enabled and
              so missed the way operators actually publish the UI: ui.ingress, plus
              the tlsAuto ergonomics the chart itself recommends. The UI's nginx
              proxies /kubeswift.v1.* to the gateway at same origin, so ui.ingress
              exposes precisely the same control plane -- and a hub was published
              unauthenticated on a public address with this guard sitting silent
              and allowInsecureIngress still false. A LoadBalancer/NodePort UI
              Service does it too, with no Ingress object at all.
            */ -}}
            {{- $viaGatewayIngress := .Values.gateway.ingress.enabled -}}
            {{- $viaUI := and .Values.ui.enabled (or .Values.ui.ingress.enabled (has .Values.ui.service.type (list "LoadBalancer" "NodePort"))) -}}
            {{- $viaGatewayService := has .Values.gateway.service.type (list "LoadBalancer" "NodePort") -}}
            {{- $reachable := or $viaGatewayIngress $viaUI $viaGatewayService -}}
            {{- if and (eq .Values.gateway.authMode "insecure") $reachable (not .Values.gateway.allowInsecureIngress) }}
              {{- fail "gateway.authMode=insecure with a reachable gateway (gateway.ingress, ui.ingress, or a LoadBalancer/NodePort Service for either) exposes an UNAUTHENTICATED control plane: every Connect RPC, the VM console and sandbox-exec WebSockets, and the RBAC editor, all running as the member cluster credential. The UI proxies these to the gateway at same origin, so publishing the UI publishes the gateway. Set gateway.authMode=oidc (or token), or keep authMode=insecure with NO ingress/LoadBalancer and reach it via kubectl port-forward. gateway.allowInsecureIngress=true accepts the risk deliberately." }}
            {{- end }}
            - --auth-mode={{ .Values.gateway.authMode }}
            - --cors-allow-origin={{ .Values.gateway.corsAllowOrigin }}
            - --prometheus-discovery-namespaces={{ join "," .Values.gateway.prometheusDiscovery.namespaces }}
            {{- if eq .Values.gateway.authMode "oidc" }}
            - --oidc-issuer-url={{ required "gateway.oidc.issuerURL is required when gateway.authMode=oidc (the default). Configure your IdP -- see docs/ui/auth.md -- or set gateway.authMode=insecure for an isolated lab." .Values.gateway.oidc.issuerURL }}
            - --oidc-client-id={{ required "gateway.oidc.clientID is required when gateway.authMode=oidc" .Values.gateway.oidc.clientID }}
            - --oidc-username-claim={{ .Values.gateway.oidc.usernameClaim }}
            - --oidc-groups-claim={{ .Values.gateway.oidc.groupsClaim }}
            {{- with .Values.gateway.oidc.usernamePrefix }}
            - --oidc-username-prefix={{ . }}
            {{- end }}
            {{- with .Values.gateway.oidc.groupsPrefix }}
            - --oidc-groups-prefix={{ . }}
            {{- end }}
            {{- if .Values.gateway.oidc.caSecret }}
            - --oidc-ca-file=/etc/kubeswift/oidc-ca/{{ .Values.gateway.oidc.caKey }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if and (eq .Values.gateway.authMode "oidc") .Values.gateway.oidc.caSecret }}
          volumeMounts:
            - name: oidc-ca
              mountPath: /etc/kubeswift/oidc-ca
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            # /readyz answers only once the manager's cache has synced and the
            # server is listening, so readiness reflects "able to serve".
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if and (eq .Values.gateway.authMode "oidc") .Values.gateway.oidc.caSecret }}
      volumes:
        - name: oidc-ca
          secret:
            secretName: {{ .Values.gateway.oidc.caSecret }}
      {{- end }}
{{- end }}
