  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: swiftartifactexportpolicies.sandbox.kubeswift.io
spec:
  group: sandbox.kubeswift.io
  names:
    kind: SwiftArtifactExportPolicy
    listKind: SwiftArtifactExportPolicyList
    plural: swiftartifactexportpolicies
    shortNames:
    - saep
    singular: swiftartifactexportpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.namespaces
      name: Namespaces
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SwiftArtifactExportPolicy is a cluster-wide, administrator-owned rule for
          where SwiftSandbox outputs may be pushed and with which credential. See
          docs/sandbox/outputs.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SwiftArtifactExportPolicySpec is a platform rule for SwiftSandbox outputs:
              which namespaces may export, to which repositories, and with which push
              credential. A workload never names a credential; it can only name a
              repository, and a repository is used only if exactly one policy that selects
              the sandbox's namespace allows it (or several that use the same credential).
              No policy: outputs are refused. See docs/sandbox/outputs.md.
            properties:
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef names a kubernetes.io/dockerconfigjson Secret in
                  the KubeSwift namespace used to push. Only the export Job mounts it;
                  tenants, launchers and guests never see it. The Secret must carry the
                  label kubeswift.io/export-credentials=true, so a policy can only name a
                  Secret an administrator set aside for this.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              defaultRepository:
                description: |-
                  DefaultRepository is where an output without repository goes, followed
                  by /<output name>: a literal repository (no globs) that may contain a
                  {namespace} segment. It must itself be allowed by repositories.
                maxLength: 200
                type: string
              maxEntries:
                description: |-
                  MaxEntries is the default and ceiling of an output's maxEntries (files
                  and directories). Default 100000, at most 1048576.
                format: int64
                maximum: 1048576
                minimum: 1
                type: integer
              maxSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  MaxSize is the default and ceiling of an output's maxSize (bytes of
                  files). Default 1Gi, at most 10Gi.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              namespaceSelector:
                description: |-
                  NamespaceSelector selects the namespaces that may export under this
                  policy. Select on labels only administrators can set
                  (kubernetes.io/metadata.name always is).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              repositories:
                description: |-
                  Repositories a selected namespace may push to, as globs over the
                  canonical repository (registry host and path): * matches within one
                  path segment, ** across segments. The host is literal. A path segment
                  that is exactly {namespace} matches the sandbox's namespace, so one
                  policy can give every namespace its own path.
                items:
                  maxLength: 255
                  type: string
                maxItems: 16
                minItems: 1
                type: array
              uploadTimeout:
                description: UploadTimeout bounds one output's push. Default 10m,
                  at most 1h.
                type: string
            required:
            - credentialsSecretRef
            - namespaceSelector
            - repositories
            type: object
          status:
            description: SwiftArtifactExportPolicyStatus reports whether the policy
              is usable.
            properties:
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespaces:
                description: Namespaces is how many namespaces the policy selects.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
