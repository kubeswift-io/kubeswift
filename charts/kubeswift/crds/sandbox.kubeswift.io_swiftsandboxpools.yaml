    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SwiftSandboxPool maintains a warm buffer of pre-booted sandbox microVMs for
          sub-second SwiftSandbox checkout. See docs/sandbox/overview.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SwiftSandboxPoolSpec defines a warm buffer of pre-booted, workload-less microVMs of
              one OCI image, kept Ready so a SwiftSandbox that references the pool (via
              spec.poolRef) checks out in sub-second time instead of paying the cold
              materialize+boot. All warm slots of the image on a node share one materialized
              rootfs. Warming is node-local: a checkout that finds no free warm slot on its target
              node degrades to the normal cold path — a miss is never a silent failure.

              The fields below are the SLOT SHAPE (a workload-less SwiftSandbox). The workload
              (command/args/env/timeout/ttl) is NOT set here — it belongs to the individual
              SwiftSandbox that checks a slot out and is injected post-boot.
            properties:
              cpu:
                default: 1
                description: CPU is the vCPU count of each warm slot. A claiming SwiftSandbox
                  must match.
                format: int32
                minimum: 1
                type: integer
              gpuProfileRef:
                description: |-
                  GPUProfileRef, when set, makes this a WARM GPU POOL: every warm slot is a
                  GPU sandbox holding a native SwiftGPU allocation (a SwiftGPUProfile in the
                  pool's namespace), pre-booted so a checkout is sub-second instead of a cold
                  GPU boot + model load. This deliberately TRADES an idle GPU per warm slot
                  for latency — each of MinWarm slots holds a whole GPU idle — so size the
                  pool to your available GPUs (on an N-GPU cluster, keep minWarm <= N). A GPU
                  pool warms only on nodes that are both gpu-node and kernel-node. The DRA
                  backend (gpuResourceClaim) is a follow-up.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              identity:
                description: |-
                  Identity is the workload identity of the pool's sandboxes (SPIFFE). A
                  warm slot holds no sandbox identity until a sandbox claims it.
                properties:
                  spiffe:
                    description: |-
                      SPIFFE gives the sandbox a SPIFFE ID,
                      spiffe://<trust-domain>/ns/<namespace>/pool/<pool>/sandbox/<name> (without
                      the pool segment when the sandbox has no poolRef). The egress proxy or
                      the built-in broker holds the SVID; the guest never sees it. Disabled
                      when unset. Not available yet: Enabled is refused until the identity
                      runtime ships.
                    enum:
                    - Enabled
                    - Disabled
                    type: string
                type: object
              image:
                description: |-
                  Image is the OCI image every warm slot boots as its root filesystem. A digest
                  reference (repo@sha256:...) is preferred for reproducibility. A SwiftSandbox must
                  request the same image (and slot shape) to claim a slot from this pool.
                type: string
              imagePullSecret:
                description: |-
                  ImagePullSecret optionally names a docker-registry Secret in the pool's namespace
                  for pulling Image from a private registry.
                type: string
              kernelProfileRef:
                description: |-
                  KernelProfileRef names the SwiftKernel sandbox profile to boot; defaults to the
                  well-known "sandbox" kernel when unset ("gpu-sandbox" for a GPU pool). A
                  claiming SwiftSandbox must resolve to the same kernel.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              maxWarm:
                description: |-
                  MaxWarm caps the total warm slots the pool will hold (back-pressure). 0 means no
                  cap beyond minWarm.
                format: int32
                minimum: 0
                type: integer
              memory:
                anyOf:
                - type: integer
                - type: string
                default: 512Mi
                description: |-
                  Memory is the RAM of each warm slot (e.g. "512Mi"). A claiming SwiftSandbox must
                  match. Note this is held per warm slot, so a pool of N slots holds N*Memory idle.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              minWarm:
                default: 1
                description: |-
                  MinWarm is the desired number of Ready (pre-booted, unclaimed) warm slots the pool
                  keeps. Because warming is node-local, the pool spreads these across the schedulable
                  kernel-nodes in scope; a claim that lands on a node with no free slot falls back to
                  the cold path.
                format: int32
                minimum: 0
                type: integer
              model:
                description: |-
                  Model preloads a read-only, node-shared model artifact (an OCI image whose
                  filesystem holds the weights) into EVERY warm slot over virtio-fs — so the
                  weights are resident (in the host page cache, shared across slots) before a
                  checkout runs and inference starts sub-second. It is the pool complement to
                  GPUProfileRef: a warm GPU pool with a model needs neither a cold GPU boot
                  NOR a cold model load on checkout. The model is materialized once per node
                  (digest-keyed, cosign-verifiable via verifyKeySecretRef) and mounted RO at
                  Model.mountPath (default /model). Every claiming SwiftSandbox inherits it.
                properties:
                  imageRef:
                    description: |-
                      ImageRef is the OCI image whose filesystem holds the model (e.g. weights
                      under the image root, or under MountPath's basename). A digest reference
                      (repo@sha256:...) is strongly preferred: it pins the content and keeps the
                      per-node cache stable across pool churn.
                    type: string
                  mountPath:
                    default: /model
                    description: |-
                      MountPath is the read-only in-guest mount point for the model tree. The
                      workload reads its weights from here.
                    type: string
                required:
                - imageRef
                type: object
              nestedVirtualization:
                description: |-
                  NestedVirtualization exposes the host CPU's virtualization extensions
                  (Intel VMX / AMD SVM) to each warm slot's guest, so it can run its own hypervisor.
                  Disabled when unset: a sandbox runs untrusted code, and nested KVM adds
                  host attack surface reachable from inside the guest. Set Enabled for a
                  workload that boots VMs (a CI job, a nested cluster). Same values as
                  SwiftGuestClass.
                  A claiming SwiftSandbox must resolve to the same value.
                enum:
                - Enabled
                - Disabled
                type: string
              network:
                description: |-
                  Network is the slot networking posture (default restricted), the same modes as
                  SwiftSandbox: restricted | open | none | proxied.
                properties:
                  egress:
                    description: |-
                      Egress lets a restricted sandbox reach destinations the restricted mode
                      blocks, such as one in-cluster Service, without opening everything. In
                      mode proxied it is the guest's allowlist, enforced by the egress proxy.
                      Only valid with mode restricted or proxied.
                    properties:
                      allow:
                        description: |-
                          Allow lists destinations the guest may reach in addition to DNS and the
                          public internet. The link-local range 169.254.0.0/16 (the cloud metadata
                          endpoint), node addresses, the API server endpoints and the administrator's
                          deny list stay blocked whatever is allowed, and IPv6 stays blocked. So do
                          the ClusterIPs, external IPs and load-balancer IPs of any Service with an
                          endpoint on one of those addresses; a service rule naming such a Service
                          keeps the sandbox Pending (EgressServiceReachesNode).
                        items:
                          description: |-
                            SandboxEgressRule allows one destination: a Service, an IPv4 CIDR or (mode
                            proxied only) a DNS name, optionally narrowed to ports. Exactly one of
                            service, cidr and host is set.
                          properties:
                            cidr:
                              description: CIDR allows an IPv4 range, e.g. 10.20.0.0/24
                                or 10.20.0.5/32.
                              type: string
                            host:
                              description: |-
                                Host allows a DNS name, e.g. api.example.com, or every name under a
                                domain with a leading "*." (*.example.com matches a.example.com and
                                a.b.example.com, not example.com). The proxy matches it against the TLS
                                server name or the HTTP Host of each connection and requires the
                                connection's destination to be an address the name resolves to. TCP
                                only. Only valid with mode proxied, and not in proxy.upstreams.
                              maxLength: 253
                              type: string
                            ports:
                              description: |-
                                Ports narrows the rule. Empty allows every port: for a Service, every
                                port the Service declares; for a CIDR, any port and protocol.
                              items:
                                description: SandboxEgressPort is one allowed destination
                                  port.
                                properties:
                                  port:
                                    description: Port number. For a Service, a port
                                      the Service declares.
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                  protocol:
                                    default: TCP
                                    description: Protocol is TCP (default) or UDP.
                                    enum:
                                    - TCP
                                    - UDP
                                    type: string
                                required:
                                - port
                                type: object
                              maxItems: 16
                              type: array
                              x-kubernetes-list-type: atomic
                            service:
                              description: |-
                                Service allows the ClusterIP of a Service. It is resolved when the
                                sandbox's launcher is created (for a pool, each time the pool reconciles:
                                warm slots holding an older address are replaced). A Service that is
                                missing, headless or has no IPv4 ClusterIP keeps the sandbox Pending.
                              properties:
                                name:
                                  description: Name of the Service.
                                  minLength: 1
                                  type: string
                                namespace:
                                  description: Namespace of the Service; defaults
                                    to the sandbox's.
                                  type: string
                              required:
                              - name
                              type: object
                            tls:
                              description: |-
                                TLS asks the proxy to originate TLS to this destination: the guest
                                connects in plaintext and the proxy connects over TLS presenting the
                                sandbox's SPIFFE X.509-SVID. Needs mode proxied and
                                spec.identity.spiffe Enabled.
                              properties:
                                originate:
                                  description: |-
                                    Originate is the client identity the proxy presents. SPIFFE is the
                                    only value.
                                  enum:
                                  - SPIFFE
                                  type: string
                              required:
                              - originate
                              type: object
                          type: object
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                      credentials:
                        description: |-
                          Credentials keeps secret values out of the guest. The guest sees each
                          as an environment variable holding a placeholder; the proxy replaces the
                          placeholder with the Secret's value in the named header of requests to
                          the listed destinations, after terminating TLS with a certificate
                          authority generated for the launcher, which the guest is made to trust.
                          The value is never written into the guest. Needs mode proxied and a
                          proxy preset with config Intent and a readiness probe (chart
                          sandboxMaterialize.egressProxyPresets), and a sandbox kernel whose
                          bridge writes files. On a pool, the shape (names, placeholders,
                          destinations, headers) is the slots'; each checkout's Secrets are read
                          when it claims a slot.
                        items:
                          description: |-
                            SandboxEgressCredential is one secret the proxy adds to requests in place
                            of a placeholder the guest holds.
                          properties:
                            destinations:
                              description: |-
                                Destinations are host or host:port (port 443 when omitted) the value is
                                sent to: one host each, no wildcard. Each must be allowed by a host rule
                                in allow. The proxy terminates the guest's TLS for these destinations
                                (the guest trusts a per-launcher CA KubeSwift adds to its CA bundle),
                                sets the header, and refuses a request whose Host is another name. The
                                placeholder means nothing anywhere else.
                              items:
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: atomic
                            header:
                              description: |-
                                Header is the request header the placeholder is replaced in.
                                Default Authorization.
                              maxLength: 128
                              type: string
                            name:
                              description: Name of the guest environment variable
                                that holds the placeholder.
                              maxLength: 128
                              minLength: 1
                              type: string
                            placeholder:
                              description: |-
                                Placeholder is the value the guest sees. Generated when unset: per pool
                                for a pool, per sandbox otherwise. 16 to 128 characters from
                                [A-Za-z0-9._-].
                              maxLength: 128
                              type: string
                            secretKeyRef:
                              description: |-
                                SecretKeyRef is the Secret key holding the real value, in the
